name: blender-image
on:
  workflow_dispatch:
  push:
    paths: ["docker/blender/**", ".github/workflows/blender-image.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker/blender
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/gpufleet-blender:5.2.2
            ghcr.io/${{ github.repository_owner }}/gpufleet-blender:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
