[project]
name = "gpufleet"
version = "0.1.0"
description = "Rent GPUs across providers (Vast.ai, Google Colab, ...) and run batch jobs on them fast, packed and without leaking billing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
colab = ["google-colab-cli>=0.7.4"]

[project.scripts]
fleet = "gpufleet.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gpufleet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
